<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Task Management Dashboard</title>

    <link rel="stylesheet" href="styles.css">
</head>

<body>

    <header class="header">
        <div class="container header-content">
            <h1>Task Management</h1>

            <nav>
                <a href="#">Dashboard</a>
                <a href="#">Projects</a>
                <a href="#">Tasks</a>
            </nav>
        </div>
    </header>


    <main class="container">

        <section class="dashboard-header">
            <div>
                <h2>Dashboard</h2>
                <p>Manage your projects and tasks.</p>
            </div>
        </section>


        <!-- Add Task -->

        <section class="card">
            <h2>Add Task</h2>

            <form id="task-form">

                <div class="form-group">
                    <label for="title">
                        Task Title
                    </label>

                    <input
                        type="text"
                        id="title"
                        name="title"
                        placeholder="Enter task title"
                    >
                </div>


                <div class="form-group">
                    <label for="description">
                        Description
                    </label>

                    <textarea
                        id="description"
                        name="description"
                        placeholder="Enter task description"
                    ></textarea>
                </div>


                <div class="form-row">

                    <div class="form-group">
                        <label for="priority">
                            Priority
                        </label>

                        <select id="priority" name="priority">
                            <option value="low">Low</option>
                            <option value="medium" selected>
                                Medium
                            </option>
                            <option value="high">High</option>
                        </select>
                    </div>


                    <div class="form-group">
                        <label for="status">
                            Status
                        </label>

                        <select id="status" name="status">
                            <option value="pending">
                                Pending
                            </option>

                            <option value="in_progress">
                                In Progress
                            </option>

                            <option value="completed">
                                Completed
                            </option>
                        </select>
                    </div>

                </div>


                <div class="form-group">
                    <label for="due_date">
                        Due Date
                    </label>

                    <input
                        type="date"
                        id="due_date"
                        name="due_date"
                    >
                </div>


                <button type="submit">
                    Add Task
                </button>

            </form>
        </section>


        <!-- Error -->

        <div
            id="error-message"
            class="error-message"
            hidden
        ></div>


        <!-- Tasks -->

        <section class="tasks-section">

            <div class="section-header">
                <h2>Tasks</h2>
            </div>

            <div
                id="task-list"
                class="task-list"
            >

                <div class="task-card">

                    <div class="task-card-header">
                        <h3>Example Task</h3>

                        <span class="priority medium">
                            Medium
                        </span>
                    </div>

                    <p>
                        This is a static task for the Day 3
                        frontend skeleton.
                    </p>

                    <div class="task-meta">
                        <span>Status: Pending</span>
                        <span>Due: 15 Aug 2026</span>
                    </div>

                </div>

            </div>

        </section>

    </main>


    <script src="script.js"></script>

</body>
</html>
